<div class="mt-8 bg-white/5 border border-white/10 rounded-2xl p-5 flex flex-col md:flex-row md:items-center justify-between gap-4">
  <div>
    <p class="text-gray-400 text-xs mb-1">ที่นั่งที่เลือก</p>
    <p class="text-white font-semibold">{{ selectedSeatCodes }}</p>
    <p class="text-gray-500 text-xs mt-0.5">{{ selectedSeats.length }} ที่นั่ง</p>
  </div>
  <div class="flex items-center gap-4">
    <!-- Countdown timer -->
    <div class="text-center">
      <p class="text-gray-500 text-xs mb-0.5">เวลาที่เหลือ</p>
      <p [class]="timerColorClass" class="font-mono font-bold text-lg leading-none">{{ formattedTime }}</p>
    </div>
    <div class="text-right">
      <p class="text-gray-400 text-xs">ราคารวม</p>
      <p class="text-yellow-400 font-black text-2xl">฿{{ totalPrice | number }}</p>
    </div>
    <button
      (click)="bookClicked.emit()"
      [disabled]="isBooking"
      class="bg-red-600 hover:bg-red-500 active:bg-red-700 disabled:opacity-60 disabled:cursor-not-allowed text-white font-bold px-7 py-3 rounded-xl transition-colors text-sm cursor-pointer flex items-center gap-2">
      @if (isBooking) {
        <svg class="animate-spin h-4 w-4" viewBox="0 0 24 24" fill="none">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"/>
        </svg>
        กำลังจอง…
      } @else {
        จองเลย
      }
    </button>
  </div>
</div>

@if (bookingError) {
  <div class="mt-3 bg-red-900/40 border border-red-500/30 text-red-400 px-4 py-3 rounded-lg text-sm">
    {{ bookingError }}
  </div>
}
